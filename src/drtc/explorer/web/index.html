<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRTC Results</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23257de0%22/%3E%3Cpath d=%22M4 11V7M8 11V4M12 11V8%22 stroke=%22white%22 stroke-width=%222%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<style>
  .evals { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .evalcard.keycard .tag { color: var(--good-text); }
  /* key findings */
  .hero { display: grid; gap: 16px; }
  .hero .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .hero h1 { font-size: clamp(24px, 3.2vw, 36px); line-height: 1.18; max-width: 30ch; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero .faultline { color: var(--ink-2); max-width: 80ch; }
  .new { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .new div { border: 1px solid var(--grid); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; color: var(--ink-2); background: var(--surface); }
  .new strong { display: block; color: var(--ink); font-size: 14px; margin-bottom: 2px; }
  .finding { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 22px; align-items: start; }
  @media (max-width: 900px) { .finding { grid-template-columns: minmax(0, 1fr); } }
  .finding .num { font: 700 13px/1 var(--text); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .finding h2 { font-size: 22px; line-height: 1.2; margin-top: 6px; }
  .finding .stat { font: 700 40px/1.05 var(--display); letter-spacing: -0.02em; margin-top: 12px; font-variant-numeric: tabular-nums; }
  .finding .stat small { display: block; margin-top: 6px; font: 500 15px/1.4 var(--text); color: var(--ink-2); letter-spacing: 0; }
  .finding .why { color: var(--ink-2); margin-top: 10px; font-size: 14.5px; }
  .finding .honest { margin-top: 10px; font-size: 13px; color: var(--ink-2); border-left: 3px solid var(--grid); padding-left: 10px; }
  .watch { display: inline-flex; gap: 6px; align-items: center; margin-top: 12px; margin-right: 8px; text-decoration: none; font-weight: 600; font-size: 13.5px;
    border: 1px solid var(--grid); border-radius: 8px; padding: 6px 11px; background: var(--surface); color: var(--ink); }
  .watch:hover { border-color: var(--axis); }
  .evalcard {
    text-align: left; background: var(--surface); border: 1px solid var(--grid); border-radius: 12px; padding: 14px 16px;
    cursor: pointer; display: grid; gap: 6px; box-shadow: var(--shadow);
  }
  .evalcard:hover { border-color: var(--axis); }
  .evalcard[aria-selected="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .evalcard .tag { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
  .evalcard .t { font: 700 18px/1.2 var(--display); }
  .evalcard .h { font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .conds { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .cond { border: 1px solid var(--grid); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; border-top: 4px solid var(--c); background: var(--surface); }
  .cond ul { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); }
  .arrow { align-self: center; color: var(--ink-3); font-size: 20px; text-align: center; }
  .metric-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  td.heat { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>
<div id="top"></div>
<main class="wrap" id="app"><div class="empty">Reading the results…</div></main>
<script src="/static/app.js"></script>
<script src="/static/findings.js"></script>
<script src="/static/results.js"></script>
</body>
</html>
