<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRTC Results</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23257de0%22/%3E%3Cpath d=%22M4 11V7M8 11V4M12 11V8%22 stroke=%22white%22 stroke-width=%222%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<style>
  .evals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 860px) { .evals { grid-template-columns: minmax(0, 1fr); } }
  .evalcard {
    text-align: left; background: var(--surface); border: 1px solid var(--grid); border-radius: 12px; padding: 14px 16px;
    cursor: pointer; display: grid; gap: 6px; box-shadow: var(--shadow);
  }
  .evalcard:hover { border-color: var(--axis); }
  .evalcard[aria-selected="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .evalcard .tag { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
  .evalcard .t { font: 700 18px/1.2 var(--display); }
  .evalcard .h { font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .conds { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .cond { border: 1px solid var(--grid); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; border-top: 4px solid var(--c); background: var(--surface); }
  .cond ul { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); }
  .arrow { align-self: center; color: var(--ink-3); font-size: 20px; text-align: center; }
  .metric-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  td.heat { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>
<div id="top"></div>
<main class="wrap" id="app"><div class="empty">Reading the results…</div></main>
<script src="/static/app.js"></script>
<script src="/static/results.js"></script>
</body>
</html>
