<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRTC Trials</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23257de0%22/%3E%3Cpath d=%22M4 11V7M8 11V4M12 11V8%22 stroke=%22white%22 stroke-width=%222%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<style>
  .layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .side { position: sticky; top: 62px; display: grid; gap: 12px; max-height: calc(100vh - 76px); overflow: auto; padding-bottom: 8px; }
  @media (max-width: 1000px) { .side { position: static; max-height: none; } }
  .filters { display: grid; gap: 10px; }
  .filters .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters label.t { font-size: 12px; font-weight: 700; color: var(--ink-2); letter-spacing: 0.04em; text-transform: uppercase; }
  .matrix { display: grid; gap: 10px; }
  .mrow { display: grid; gap: 4px; }
  .mrow .name { font-size: 13px; font-weight: 700; }
  .cells { display: grid; gap: 6px; }
  .cell { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 6px; align-items: center; }
  .cell .cl { font-size: 11.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; }
  .sq { display: flex; flex-wrap: wrap; gap: 3px; }
  .sq button {
    width: 19px; height: 19px; border-radius: 4px; border: 0; padding: 0; cursor: pointer; font-size: 10px; font-weight: 700;
    color: #fff; display: grid; place-items: center; position: relative;
  }
  .sq button.success { background: var(--good); }
  .sq button.failed { background: var(--critical); }
  .sq button.time_limit { background: var(--warning); color: #0b0b0b; }
  .sq button.fault { background: var(--serious); color: #0b0b0b; }
  .sq button.not_counted { background: var(--surface-2); color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--grid); }
  .sq button.novideo::after { content: ""; position: absolute; right: 2px; top: 2px; width: 5px; height: 5px; border-radius: 50%; background: rgba(0,0,0,.45); }
  .sq button[aria-current="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
  .sq button.dim { opacity: 0.18; }
  .sq button.picked { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
  .player { display: grid; gap: 14px; min-width: 0; }
  .phead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .phead h1 { font-size: 22px; }
  .videos { display: grid; grid-template-columns: 3fr 2fr; gap: 10px; }
  .videos.one { grid-template-columns: minmax(0, 1fr); }
  @media (max-width: 700px) { .videos { grid-template-columns: minmax(0, 1fr); } }
  .vbox { background: #0b0b0b; border-radius: 10px; overflow: hidden; position: relative; aspect-ratio: 4 / 3; }
  .vbox video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .vbox .cap { position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 5px; }
  .vbox .fault-flag { position: absolute; right: 8px; top: 8px; background: var(--serious); color: #0b0b0b; font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 5px; display: none; }
  .vbox .stall-flag { position: absolute; right: 8px; bottom: 8px; background: var(--critical); color: #fff; font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 5px; display: none; }
  .novideo-box { display: grid; place-items: center; aspect-ratio: auto; min-height: 120px; color: #bbb; font-size: 14px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .playbtn { border: 0; background: var(--ink); color: var(--surface); border-radius: 8px; padding: 8px 16px; font-weight: 700; cursor: pointer; min-width: 92px; }
  .clock { font: 600 15px var(--mono); font-variant-numeric: tabular-nums; }
  .timeline svg { touch-action: none; user-select: none; }
  .lane-label { fill: var(--ink-2); font-size: 12px; font-weight: 600; }
  .events td { cursor: pointer; }
  .joint-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .joint-chips .chip { padding: 2px 9px; font-size: 12px; }
  kbd { font: 600 11px var(--mono); border: 1px solid var(--grid); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); }
</style>
</head>
<body>
<div id="top"></div>
<main class="wrap" style="max-width:1480px">
  <div class="layout">
    <aside class="side" id="side"><div class="panel empty">Reading the results…</div></aside>
    <section class="player" id="player"></section>
  </div>
</main>
<script src="/static/app.js"></script>
<script src="/static/trials.js"></script>
</body>
</html>
