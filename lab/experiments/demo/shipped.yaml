# The live demo console (lab demo): LeRobot as shipped (1 s starvation grace, 5 s request deadline). As the setup v2 bench conditions (lab/experiments/v2/), with the bench's
# 250 ms reply latency and no scheduled faults: the console's buttons inject them.
description: 'Demo console: LeRobot as shipped (1 s starvation grace, 5 s request deadline)'
model: smolvla_sort_one_v1_full
action_filter_mode: none
scheduler: upstream
estimator: upstream
cooldown: false
request_deadline: lerobot
starvation_grace_s: 1.0
latency:
  base_ms: 250
  jitter_ms: 20
  seed: 0
