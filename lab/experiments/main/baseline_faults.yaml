description: "Condition 2: baseline + faults - upstream LeRobot as it ships, the fault mix"
model: smolvla_sort_one_v1_full
scheduler: upstream          # LeRobot's own scheduling (no DRTC)
estimator: upstream
cooldown: false
action_filter_mode: none
starvation_grace_s: 1.0      # upstream as it ships: ends the run after 1 s without actions
spikes:                      # the fault mix (lab/PLAN.md)
  - {start_s: 2.0, delay_ms: 1000}
drop_action:
  - {start_s: 4.0, duration_s: 1.0}
disconnect:
  - {start_s: 6.0, duration_s: 1.5}
