# Shared settings for every experiment. An experiment file overrides any key here.

# DRTC
estimator: jk
cooldown: true
latency_k: 1.5
epsilon: 1
cooldown_cap: none     # none: never shorter than the measured latency (2026-11-20); half_chunk: DRTC's original H/2 cap
actions_per_chunk: 50
s_min: 20
latency_alpha: 0.125
latency_beta: 0.25

# Timing
duration_s: 25.0
fps: 30

# Flow matching / RTC
num_flow_matching_steps: 8
rtc_enabled: false   # true: guided RTC (SmolVLA, GR00T N1.5 only); was true but never applied before 2026-11-20
rtc_sigma_d: 0.2
rtc_prefix_attention_schedule: linear

# Smoothing methods (lab additions; lab/experiments/smoothing/). Off by default.
smoothness_guidance: 0.0        # jerk penalty in flow-matching denoising, 0-2 (0.5 = moderate)
playback_mode: fixed            # fixed | adaptive (slow down while few actions are queued)
playback_min_rate: 0.5
playback_margin_steps: 4.0
playback_rate_slew: 0.05

# Action filter
action_filter_mode: butterworth
action_filter_butterworth_cutoff: 3.0
action_filter_gain: 1.4

# Diagnostics
full_diagnostics: false
