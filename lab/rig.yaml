# Physical rig -- the single source of truth for hardware.
# Experiments never set these; change them here when the hardware changes.
#
# Device paths use /dev/*/by-id names (USB vendor + serial), so the same file works on the Pi
# and the laptop whichever USB socket things are plugged into. Globs resolve to their single match.

hosts:
  server: laptop4060          # labels recorded with every run
  client: raspberrypiv5
  gpu: RTX 4060 Laptop

server:
  host: 10.42.0.1             # laptop hotspot
  port: 8080

robot:
  type: so101
  port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B79017420-if00
  id: follower                # calibration/robots/so101_follower/follower.json

leader:
  port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B79016953-if00
  id: leader                  # calibration/teleoperators/so101_leader/leader.json

# Order is fixed: datasets and trained models depend on camera1/camera2 identity.
# Before 2026-11-11 both were scene cameras (Zebronics + phone); data and models from then
# do not match the current wrist/scene layout.
cameras:
  width: 800
  height: 600
  fps: 30
  camera1:                    # Zebronics Zeb Live Pro -- WRIST camera (since 2026-11-11)
    path: /dev/v4l/by-id/usb-*ZEB_LIVE_PRO*-video-index0
    fourcc: MJPG
  camera2:                    # Android phone (DroidCam over USB -> v4l2loopback) -- SCENE camera (since 2026-11-11)
    path: /dev/video10

phonecam:
  droidcam_port: 4747
  device: /dev/video10
