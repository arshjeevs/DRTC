  finetune: lora
  fps: 30
  task: Pick the green cube and place it in the box
  rtc_enabled: true
  train:
    dataset: orangemoon599/train_new_1
    from: lerobot/smolvla_base
    steps: 20000
    batch_size: 64
    lora: {r: 32, alpha: 64, dropout: 0.05, targets: expert}

# The base models name their cameras differently, so rename_map maps ours onto theirs: the phone
# (camera2, scene) to the main view and the Zebronics (camera1, wrist) to a wrist view. The unused
# third view is masked out by the model.
# Larger VLAs on the same data. Batch sizes assume a 24 GB+ GPU: lower batch_size if it runs out of memory.
# pi0 / pi05 need the patched transformers build (pip extra "pi"), in a venv separate from SmolVLA's.
pi05_train_new_1_full:
  policy_type: pi05
  pretrained_name_or_path: orangemoon599/pi05_train_new_1_full
  finetune: full
  fps: 30
  task: Pick the green cube and place it in the box
  rtc_enabled: true
  train:
    dataset: orangemoon599/train_new_1
    from: lerobot/pi05_base
    steps: 6000
    batch_size: 32
    save_freq: 2000
    # train_expert_only freezes the PaliGemma VLM (as SmolVLA does); set false to train everything (40 GB+).
    flags: {policy.dtype: bfloat16, policy.gradient_checkpointing: true, policy.train_expert_only: true, rename_map: {observation.images.camera2: observation.images.base_0_rgb, observation.images.camera1: observation.images.right_wrist_0_rgb}}

pi0_train_new_1_full:
  policy_type: pi0
  pretrained_name_or_path: orangemoon599/pi0_train_new_1_full
  finetune: full
  fps: 30
  task: Pick the green cube and place it in the box
  rtc_enabled: true
  train:
    dataset: orangemoon599/train_new_1
    from: lerobot/pi0_base
    steps: 6000
    batch_size: 32
    save_freq: 2000
    flags: {policy.dtype: bfloat16, policy.gradient_checkpointing: true, policy.train_expert_only: true, rename_map: {observation.images.camera2: observation.images.base_0_rgb, observation.images.camera1: observation.images.right_wrist_0_rgb}}

# X-VLA trains here, but the policy server does not serve it yet (not in SUPPORTED_POLICIES).
xvla_train_new_1_full:
  policy_type: xvla
  pretrained_name_or_path: orangemoon599/xvla_train_new_1_full
  finetune: full
  fps: 30
  task: Pick the green cube and place it in the box
  rtc_enabled: false
  num_flow_matching_steps: null
  train:
    dataset: orangemoon599/train_new_1
    from: lerobot/xvla-base
    steps: 20000
    batch_size: 16
    flags: {policy.dtype: bfloat16, policy.action_mode: auto, rename_map: {observation.images.camera2: observation.images.image, observation.images.camera1: observation.images.image2}}

# LoRA versions. targets: vlm+expert also adapts the language backbone (the point of LoRA on these
# models); use targets: expert, or a smaller batch_size, if the GPU runs out of memory.
pi05_train_new_1_lora:
  policy_type: pi05
  pretrained_name_or_path: orangemoon599/pi05_train_new_1_lora
  finetune: lora
  fps: 30
  task: Pick the green cube and place it in the box
  rtc_enabled: true
  train:
    dataset: orangemoon599/train_new_1
    from: lerobot/pi05_base
    steps: 6000
    batch_size: 16
    save_freq: 2000
    flags: {policy.dtype: bfloat16, policy.gradient_checkpointing: true, rename_map: {observation.images.camera2: observation.images.base_0_rgb, observation.images.camera1: observation.images.right_wrist_0_rgb}}
    lora: {r: 32, alpha: 64, dropout: 0.05, targets: vlm+expert}

pi0_train_new_1_lora:
  policy_type: pi0
  pretrained_name_or_path: orangemoon599/pi0_train_new_1_lora
  finetune: lora
  fps: 30
  task: Pick the green cube and place it in the box
  rtc_enabled: true
  train:
    dataset: orangemoon599/train_new_1
    from: lerobot/pi0_base
    steps: 6000
    batch_size: 16
    save_freq: 2000
    flags: {policy.dtype: bfloat16, policy.gradient_checkpointing: true, rename_map: {observation.images.camera2: observation.images.base_0_rgb, observation.images.camera1: observation.images.right_wrist_0_rgb}}
    lora: {r: 32, alpha: 64, dropout: 0.05, targets: vlm+expert}

xvla_train_new_1_lora:
  policy_type: xvla
  pretrained_name_or_path: orangemoon599/xvla_train_new_1_lora
  finetune: lora
  fps: 30
  task: Pick the green cube and place it in the box
  rtc_enabled: false
  num_flow_matching_steps: null
  train:
    dataset: orangemoon599/train_new_1
    from: lerobot/xvla-base
    steps: 20000
    batch_size: 16
    save_freq: 5000
    flags: {policy.dtype: bfloat16, policy.action_mode: auto, rename_map: {observation.images.camera2: observation.images.image, observation.images.camera1: observation.images.image2}}
    lora: {r: 32, alpha: 64, dropout: 0.05, targets: vlm+expert}

# ACT: small (~50M), trained from scratch (ImageNet ResNet18 backbone). No language input, no RTC.
# Small enough for CPU inference on the Pi: the candidate edge-fallback policy.
act_train_new_1_full:
  policy_type: act
  pretrained_name_or_path: orangemoon599/act_train_new_1_full
  finetune: full
  fps: 30
  task: Pick the green cube and place it in the box
  rtc_enabled: false
  num_flow_matching_steps: null
  train:
    dataset: orangemoon599/train_new_1
    steps: 40000
    batch_size: 64
    save_freq: 10000

# ===================================================================================================
# Study on the new dataset (lab/PROPOSAL.md). Set the dataset name, task and held-out split ONCE here;
# every entry below refers to them. Entry names use the dataset's short name (train_new_2): if the
# dataset is called something else, rename with  sed -i 's/train_new_2/<name>/g' lab/models.yaml
# ===================================================================================================
_study:
  dataset: &study_ds orangemoon599/train_new_2
  # lab/bin/ablate-cameras orangemoon599/train_new_2  creates these two single-camera copies
  wrist_only: &study_ds_wrist orangemoon599/train_new_2_wrist   # camera1 (Zebronics, wrist) only
  scene_only: &study_ds_scene orangemoon599/train_new_2_scene   # camera2 (phone, scene) only
  task: &study_task Pick the green cube and place it in the box
  # Training episodes; the rest are held out for offline evaluation. "0-44" = 45 train / 5 held out of 50.
  train_episodes: &study_train "0-44"
  pi_cameras: &pi_rename {observation.images.camera2: observation.images.base_0_rgb, observation.images.camera1: observation.images.right_wrist_0_rgb}
  xvla_cameras: &xvla_rename {observation.images.camera2: observation.images.image, observation.images.camera1: observation.images.image2}

# --- SmolVLA: full vs LoRA (item 14) ---
smolvla_train_new_2_full:
  policy_type: smolvla
  pretrained_name_or_path: orangemoon599/smolvla_train_new_2_full
  finetune: full
  fps: 30
  task: *study_task
  rtc_enabled: true
  train: {dataset: *study_ds, episodes: *study_train, from: lerobot/smolvla_base, steps: 20000, batch_size: 64}

smolvla_train_new_2_lora:
  policy_type: smolvla
  pretrained_name_or_path: orangemoon599/smolvla_train_new_2_lora
  finetune: lora
  fps: 30
  task: *study_task
  rtc_enabled: true
  train:
    {dataset: *study_ds, episodes: *study_train, from: lerobot/smolvla_base, steps: 20000, batch_size: 64,
     lora: {r: 32, alpha: 64, dropout: 0.05, targets: expert}}

# --- Data efficiency (item 15): same recipe as smolvla_train_new_2_lora, fewer episodes, same steps ---
smolvla_train_new_2_lora_10ep:
