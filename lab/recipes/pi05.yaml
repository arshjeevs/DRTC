# Training recipes. `source`: who made this work and where it comes from.

pi05_openpi:
  source: 'openpi pi05_aloha_pen_uncap (the openpi config for a joint-space arm): full fine-tune, 20k steps x batch
    64, AdamW (0.9, 0.95) wd 1e-10 clip 1.0, LR 2.5e-5 peak, 1k warmup, cosine to 2.5e-6 over 30k, EMA 0.99, delta
    joints + absolute gripper, quantile norm, chunk 50 (github.com/Physical-Intelligence/openpi, training/config.py)'
  policy: pi05
  finetune: full
  base: lerobot/pi05_base@a538eb273274eb30f126a118f39dbc0ee212c883
  train: {steps: 20000, batch_size: 64, save_freq: 1000}
  flags: {policy.dtype: bfloat16, policy.gradient_checkpointing: true, policy.train_expert_only: false,
    policy.freeze_vision_encoder: false, policy.chunk_size: 50, policy.n_action_steps: 50,
    policy.use_relative_actions: true, policy.relative_exclude_joints: [gripper],
    policy.optimizer_lr: 2.5e-5, policy.optimizer_betas: [0.9, 0.95], policy.optimizer_weight_decay: 1.0e-10,
    policy.optimizer_grad_clip_norm: 1.0, policy.scheduler_warmup_steps: 1000, policy.scheduler_decay_steps: 30000,
    policy.scheduler_decay_lr: 2.5e-6, ema.type: constant, ema.decay: 0.99}
  serve: {rtc_enabled: true}
  cameras: {scene: observation.images.base_0_rgb, wrist: observation.images.right_wrist_0_rgb}
