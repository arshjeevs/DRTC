# Training recipes. `source`: who made this work and where it comes from.

smolvla_lora_20k:
  policy: smolvla
  finetune: lora
  base: lerobot/smolvla_base
  train: {steps: 20000, batch_size: 64}
  lora: {r: 32, alpha: 64, dropout: 0.05, targets: expert}
  serve: {rtc_enabled: true}
smolvla_authors:
  source: 'SmolVLA authors: action expert only, VLM frozen (paper arXiv 2506.01844 §4.3); 20k steps x batch 64
    (LeRobot SmolVLA docs); LR 1e-4, 1k warmup, cosine to 2.5e-6 (LeRobot defaults; the docs give no other)'
  policy: smolvla
  finetune: full   # not adapter LoRA; the VLM is frozen as the authors do
  base: lerobot/smolvla_base
  train: {steps: 20000, batch_size: 64, save_freq: 1000}
  flags: {policy.freeze_vision_encoder: true, policy.train_expert_only: true, policy.chunk_size: 50,
    policy.n_action_steps: 50, policy.optimizer_lr: 1.0e-4, policy.scheduler_warmup_steps: 1000,
    policy.scheduler_decay_steps: 30000, policy.scheduler_decay_lr: 2.5e-6}
  serve: {rtc_enabled: true}
  speed: {policy.compile_model: true}   # H200 2026-11-19: step 0.323 -> 0.205 s, peak 14.7 -> 4.6 GB (1.8 -> 1.1 h)
