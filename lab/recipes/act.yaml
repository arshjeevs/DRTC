# Training recipes. `source`: who made this work and where it comes from.

act_original:
  source: 'ACT (Zhao et al. 2023, arXiv 2304.13705; github.com/tonyzhaozh/act): batch 8, Adam LR 1e-5 (backbone
    too), wd 1e-4, KL 10, chunk 100, train long (">= 5000 epochs" of one sample per episode ~ 69k steps for 110
    episodes); 100k steps = LeRobot''s default length. Temporal ensembling off (the policy server refuses it)'
  policy: act
  finetune: full
  train: {steps: 100000, batch_size: 8, save_freq: 5000}
  flags: {policy.chunk_size: 100, policy.n_action_steps: 100, policy.kl_weight: 10.0, policy.optimizer_lr: 1.0e-5,
    policy.optimizer_lr_backbone: 1.0e-5, policy.optimizer_weight_decay: 1.0e-4}
  serve: {rtc_enabled: false, num_flow_matching_steps: null}
