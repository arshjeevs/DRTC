# Baseline on sort_one (lab/PLAN.md, setup v2 robot evals, 2026-11-22): upstream LeRobot with the starvation grace
# raised to the whole trial (the same reference condition as E4), normal network, 10 trials per model.
# The 5 trained models now; π0.5 and MolmoAct 2 are added to `models` when trained and frozen with
# `lab eval freeze` (append-only: the frozen models never change; lab/WORKFLOW.md, "Growing an eval").
description: Baseline, sort_one - upstream LeRobot (patient), normal network
success: The cube is fully inside the square of its colour and the gripper has let go of it, before the time limit.
time_limit_s: 30
trials: 10
seed: 0
models:
- smolvla_sort_one_v1_full
- groot_sort_one_v1_full
- grootn17_sort_one_v1_full
- act_sort_one_v1_full
- diffusion_sort_one_v1_full
conditions:
  baseline: v2_robot/upstream_patient__none
video: true
