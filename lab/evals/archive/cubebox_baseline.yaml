# Phase 6 baseline, cube in the box (lab/PLAN.md Phase 6; lab/docs/EVALUATION.md; metrics: lab/METRICS.md v1).
# The new full fine-tunes on cubebox v0 and v1 against the two models kept from the minor (minor results: GR00T
# LoRA 80%, SmolVLA LoRA 90%), all as trained, in one eval so that they are compared in the same sessions
# (METRICS.md rule 5). Each model is always given its own dataset's instruction: v0 "Pick the green cube and place it
# in the box", v1 "Pick up the green cube and put it inside the box."
description: Phase 6 baseline, cube in the box (v0, v1 and the kept minor models, as trained)
task: Put the green cube in the box (each model gets its own dataset's wording)
success: The green cube ends inside the box and the gripper is open, before the time limit.
time_limit_s: 30
trials: 20                # valid trials per model (METRICS.md rule 1)
seed: 0
models:
  - act_cubebox_v0_full             # new, cubebox v0 (trimmed)
  - smolvla_cubebox_v0_full         # new, cubebox v0 (trimmed)
  - groot_cubebox_v1_full           # new, cubebox v1 (trimmed)
  - groot_cubebox_v1_lora_raw       # kept from the minor (80%)
  - smolvla_cubebox_v0_lora_raw     # kept from the minor (90%)
conditions:
  baseline: archive/replication/baseline     # DRTC with its defaults, no faults
video: true

# Written by `lab eval freeze`: the Hub commit each model is served at. Do not edit by hand.
frozen:
