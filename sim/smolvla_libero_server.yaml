deployment: smolvla-libero
model:
  repo_or_path: lerobot/smolvla_libero
  revision: null
  device: cuda
execution:
  supported_modes: [chunk]
  action_fps: 20.0
zenoh:
  mode: peer
  listen_endpoints: [tcp/127.0.0.1:7960]
semantics: libero-delta-v1
robot_type: panda
features:
  - name: observation.state
    shape: [8]
    dtype: float32
    names: [eef.x, eef.y, eef.z, eef.axis_angle.x, eef.axis_angle.y, eef.axis_angle.z, gripper.left.pos, gripper.right.pos]
    semantics: libero-delta-v1
  - name: observation.images.camera1
    shape: [256, 256, 3]
    dtype: uint8
    kind: rgb
    semantics: libero-delta-v1
  - name: observation.images.camera2
    shape: [256, 256, 3]
    dtype: uint8
    kind: rgb
    semantics: libero-delta-v1
action_feature:
  name: action
  shape: [7]
  dtype: float32
  names: [eef.delta.x, eef.delta.y, eef.delta.z, eef.delta.axis_angle.x, eef.delta.axis_angle.y, eef.delta.axis_angle.z, gripper.command]
  semantics: libero-delta-v1
