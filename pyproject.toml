[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drtc-lab"
version = "0.1.0"
description = "Remote VLA control and lab tooling for a low-cost SO101 robot, on top of LeRobot"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
# Robot side (Pi, laptop as client/recorder): hardware, recording, remote-inference client.
# LeRobot is pinned exactly: an upgrade is a deliberate change of this line + uv.lock.
dependencies = [
    "lerobot[core_scripts,feetech,remote]==0.7.0",
    "pyyaml>=6.0,<7",
    # Used directly by drtc (the registry and eval files; the Butterworth filter, the report's tests). The GPU extra
    # brought them in indirectly, so their absence showed only on the Pi (2026-11-20).
    "pydantic>=2.14,<3",
    "scipy>=1.18,<2",
    # torch is pinned to the newest build for CUDA 13.0: the H200's driver (580) cannot be changed and supports
    # CUDA up to 13.0. Linux x86_64 (laptop, H200) gets it from PyTorch's cu130 index; the A100 its cu126 build
    # (lab/bin/a100-setup), the Pi the CPU build (lab/bin/pi-setup).
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[project.optional-dependencies]
# GPU side (laptop, H200, more compute hosts): training and serving the policies we use.
gpu = [
    "lerobot[training,peft,smolvla,pi,xvla,groot]==0.7.0",
    "lerobot_policy_groot_n15",
    "wandb>=0.21",
]
# Runs the robot-side control loop without hardware (lerobot_robot_replay: --robot.type=replay).
sim = ["lerobot_robot_replay"]

[project.scripts]
lab = "drtc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drtc"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
lerobot_policy_groot_n15 = { workspace = true }
lerobot_robot_replay = { workspace = true }
torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
