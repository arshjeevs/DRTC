# Phase 3 speed comparisons, run with tests/bench/round.py <variant ...> (all variants without arguments).
# Each variant: the models to run and, per model, the lab train flags to add (compared with logs/bench/baseline,
# the recipes as they are) and optionally `workers`. Results: logs/bench/<variant>/.
# `parallel: true` runs the variant's models at the same time on the one GPU (logs/bench/<variant>/<model>/), to
# see how much several small jobs together gain over one after another.
# Only settings that do not change what the model learns belong here; anything that does (bf16 for ACT/Diffusion, a
# different batch) is a recipe change and is asked first.

frames:         # Diffusion with its frame cache (recipe data.frames, on since 2026-11-19); compare with baseline
  models:
    diffusion_cubebox_v1_full: {}

no_grad_ckpt:   # gradient checkpointing trades speed for memory; the recipes turn it on, the result is the same
  models:
    pi05_cubebox_v1_full: {flags: {policy.gradient_checkpointing: false}}
    molmoact2_cubebox_v1_lora: {flags: {policy.gradient_checkpointing: false}}

compile:        # torch.compile of the policy (MolmoAct 2's recipe already compiles)
  models:
    pi05_cubebox_v1_full: {flags: {policy.compile_model: true}}
    smolvla_cubebox_v1_full: {flags: {policy.compile_model: true}}
    diffusion_cubebox_v1_full: {flags: {policy.compile_model: true}}

gpu_aug:        # MolmoAct 2's image augmentation on the GPU (same transforms) instead of in the DataLoader workers
  models:
    molmoact2_cubebox_v1_lora: {flags: {dataset.image_transforms.backend: gpu}}

workers16:
  models:
    diffusion_cubebox_v1_full: {workers: 16}
    molmoact2_cubebox_v1_lora: {workers: 16}

together:       # small jobs next to a large one on the same GPU
  parallel: true
  models:
    act_cubebox_v1_full: {}
    diffusion_cubebox_v1_full: {}
    smolvla_cubebox_v1_full: {}
