# Baseline (no faults) -- policy server on a local laptop GPU, client on a Raspberry Pi
# Lab setup guide: docs/LAB_SETUP.md
name: baseline_laptop_raspberry

# Hardware
robot_type: so101
gpu: RTX 4060 Laptop
client_host: raspberrypiv5
server_host: laptop4060

# Robot + cameras
# robot_id must match ~/.cache/huggingface/lerobot/calibration/robots/so101_follower/<robot_id>.json
robot_port: /dev/ttyACM0
robot_id: follower
camera1_path: /dev/v4l/by-path/platform-xhci-hcd.1-usb-0:1:1.0-video-index0   # Brio 100
camera2_path: /dev/video10                                                   # Phone (DroidCam via v4l2loopback)
camera_width: 800
camera_height: 600
camera_fps: 30
camera_fourcc: MJPG
camera_use_threaded_async_read: true
camera_allow_stale_frames: true

# Policy
policy_type: smolvla
pretrained_name_or_path: jackvial/so101_smolvla_pickplaceorangecube_e100

# DRTC parameters
estimator: jk
cooldown: true
latency_k: 1.5
epsilon: 1
actions_per_chunk: 50
s_min: 20
latency_alpha: 0.125
latency_beta: 0.25

# Timing
duration_s: 25.0
fps: 60

# Flow matching / RTC
num_flow_matching_steps: 8
rtc_enabled: true
rtc_sigma_d: 0.2
rtc_prefix_attention_schedule: linear

# Butterworth filter
action_filter_mode: butterworth
action_filter_butterworth_cutoff: 3.0
action_filter_gain: 1.4

# Diagnostics
full_diagnostics: true
